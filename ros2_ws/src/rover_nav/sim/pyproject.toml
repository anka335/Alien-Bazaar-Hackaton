[project]
name = "leo-sim"
version = "0.1.0"
description = "Leo Rover in MuJoCo, drivable by hand or by the jevomir scoring API"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]
# Only for tools/convert_meshes.py, which rebuilds assets/ from the official leo_description.
meshes = ["trimesh>=4", "pycollada>=0.8", "fast-simplification>=0.1", "networkx>=3", "lxml>=5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
