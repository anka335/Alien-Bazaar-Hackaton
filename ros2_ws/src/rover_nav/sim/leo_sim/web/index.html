<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo Rover sim</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2c3038; --text: #e6e6e3; --muted: #9097a3;
    --accent: #ffb000; --good: #3ecf8e; --bad: #ff5d5d; --bar: #4f8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
           padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .chip { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip b { color: var(--text); font-weight: 500; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; padding: 12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
              margin: 0 0 8px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .view img { width: 100%; display: block; border-radius: 4px; background: #000; aspect-ratio: 4/3; object-fit: contain; }
  .tabs { margin-left: auto; display: flex; gap: 4px; }
  button, select, input { font: inherit; color: var(--text); background: #262a31; border: 1px solid var(--line);
                          border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .pad { display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; }
  .pad button { padding: 8px 0; }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .status { font-weight: 600; }
  .status.success { color: var(--good); } .status.failed, .status.error, .status.tipped { color: var(--bad); }
  .status.running { color: var(--accent); }
  .err { color: var(--bad); min-height: 1.4em; }
  #steps { grid-column: 1 / -1; }
  .step { display: grid; grid-template-columns: 168px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .step img { width: 168px; border-radius: 4px; }
  .step .head { font-weight: 600; margin-bottom: 4px; }
  .step .head .muted { font-weight: 400; }
  .muted { color: var(--muted); }
  .q { margin: 4px 0 6px; }
  .opt { display: grid; grid-template-columns: 170px 1fr 48px; gap: 8px; align-items: center; font-size: 13px; }
  .opt .bar { height: 8px; background: #2a2e36; border-radius: 4px; overflow: hidden; }
  .opt .bar i { display: block; height: 100%; background: var(--bar); }
  .opt.best { color: var(--accent); } .opt.best .bar i { background: var(--accent); }
  .opt span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Leo Rover <span>MuJoCo</span></h1>
  <div class="chip">sim <b id="t">–</b> s</div>
  <div class="chip">pose <b id="pose">–</b></div>
  <div class="chip">odom <b id="odom">–</b></div>
  <div class="chip">motion <b id="motion">–</b></div>
  <div class="chip">jevomir <b id="api">–</b></div>
</header>

<main>
  <section class="panel view">
    <h2>Camera <span class="tabs" id="camTabs">
      <button data-cam="leo" class="on">rover</button><button data-cam="oak">OAK-D</button><button data-cam="chase">chase</button>
    </span></h2>
    <img id="cam" alt="camera view">
  </section>

  <div class="side">
    <section class="panel view">
      <h2>Map <span class="muted" style="text-transform:none;letter-spacing:0">(ground truth; the model never sees it)</span></h2>
      <img id="map" alt="top-down map" style="aspect-ratio:auto">
    </section>

    <section class="panel">
      <h2>jevomir drives</h2>
      <div class="row">
        <label>target <select id="target"></select></label>
        <label>policy <select id="policy"></select></label>
      </div>
      <div class="row">
        <label>answers <select id="scorer"><option value="jevomir">jevomir API</option><option value="oracle">oracle (sim truth)</option></select></label>
        <label><input type="checkbox" id="both" checked> both orders</label>
        <label title="the path from odometry: control = the agent acts on it, prompt = told to the model">memory <select id="memory"><option>off</option><option>control</option><option>prompt</option></select></label>
        <label>steps <input id="steps-max" type="number" value="40" min="1" max="200" style="width:64px"></label>
      </div>
      <div class="row">
        <button class="primary" id="go">Start</button><button id="halt">Stop</button>
        <span class="status" id="agentStatus"></span>
      </div>
      <div class="err" id="err"></div>
    </section>

    <section class="panel">
      <h2>Drive by hand</h2>
      <div class="row">
        <div class="pad">
          <span></span><button data-drive="forward">▲</button><span></span>
          <button data-drive="left">◀</button><button data-drive="stop">■</button><button data-drive="right">▶</button>
          <span></span><button data-drive="back">▼</button><span></span>
        </div>
        <div class="muted">arrows or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>, <kbd>space</kbd> stops.<br>
          25 cm / 20° per press.</div>
      </div>
      <div class="row">
        <label>room seed <input id="seed" placeholder="fixed" style="width:80px"></label>
        <button id="reset">New room</button>
      </div>
    </section>
  </div>

  <section class="panel" id="steps">
    <h2>What jevomir saw and answered <span class="muted" id="summary" style="text-transform:none;letter-spacing:0"></span></h2>
    <div id="stepList" class="muted">No run yet.</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let camera = "leo", shownSteps = -1, shownRun = null;

async function post(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  $("err").textContent = r.ok ? "" : (data.detail || r.statusText);
  return r.ok;
}

function stream(img, cam) {  // chain loads so requests never pile up
  const next = () => setTimeout(() => { img.src = `/api/frame/${cam()}.jpg?t=${Date.now()}`; }, 80);
  img.onload = next; img.onerror = () => setTimeout(next, 500); next();
}
stream($("cam"), () => camera);
stream($("map"), () => "map");

document.querySelectorAll("#camTabs button").forEach((b) => b.onclick = () => {
  camera = b.dataset.cam;
  document.querySelectorAll("#camTabs button").forEach((x) => x.classList.toggle("on", x === b));
});
document.querySelectorAll("[data-drive]").forEach((b) => b.onclick = () => post("/api/drive", { action: b.dataset.drive }));
const keys = { ArrowUp: "forward", w: "forward", ArrowDown: "back", s: "back", ArrowLeft: "left", a: "left",
               ArrowRight: "right", d: "right", " ": "stop" };
addEventListener("keydown", (e) => {
  if (e.target.matches("input, select") || !keys[e.key]) return;
  e.preventDefault(); post("/api/drive", { action: keys[e.key] });
});

$("go").onclick = () => post("/api/agent/start", {
  target: $("target").value, policy: $("policy").value, scorer: $("scorer").value,
  both_orders: $("both").checked, memory: $("memory").value, max_steps: +$("steps-max").value });
$("halt").onclick = () => post("/api/agent/stop");
$("reset").onclick = async () => { if (await post("/api/reset", { seed: $("seed").value.trim() || null })) loadWorld(); };

async function loadWorld() {
  const w = await (await fetch("/api/world")).json();
  const keep = $("target").value;
  $("target").innerHTML = w.objects.map((o) => `<option value="${o.name}">${o.label}</option>`).join("");
  if (w.objects.some((o) => o.name === keep)) $("target").value = keep;
  if (!$("policy").options.length) $("policy").innerHTML = w.policies.map((p) => `<option>${p}</option>`).join("");
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const deg = (r) => (r * 180 / Math.PI).toFixed(0);

function renderSteps(agent) {
  if (!agent.steps.length) { $("stepList").textContent = "Waiting for the first answer…"; return; }
  $("stepList").classList.remove("muted");
  $("stepList").innerHTML = agent.steps.slice().reverse().map((s) => {
    const amount = s.action === "left" || s.action === "right" ? `${deg(s.amount)}°` : s.action === "done" ? "" : `${s.amount} m`;
    const r = s.result ? ` → ${s.result.outcome}${s.result.bumped.length ? ` · bumped ${s.result.bumped.join(", ")}` : ""}` : "";
    const qs = s.questions.map((q) => {
      const best = Math.max(...q.probabilities);
      return `<div class="q">${esc(q.question)}</div>` + q.options.map((o, i) => {
        const p = q.probabilities[i];
        return `<div class="opt ${p === best ? "best" : ""}"><span>${esc(o)}</span><span class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></span><span>${(p * 100).toFixed(1)}%</span></div>`;
      }).join("");
    }).join("");
    return `<div class="step"><img src="/api/step/${s.step}.jpg" alt="step ${s.step}">
      <div><div class="head">#${s.step} ${s.action} ${amount} <span class="muted">${esc(s.reason)}${esc(r)}</span></div>${s.memory ? `<div class="q muted">${esc(s.memory)}</div>` : ""}${qs}</div></div>`;
  }).join("");
}

async function poll() {
  try {
    const st = await (await fetch("/api/state")).json();
    const sim = st.sim;
    if (sim.pose) {
      $("t").textContent = sim.time.toFixed(1);
      $("pose").textContent = `${sim.pose.x.toFixed(2)}, ${sim.pose.y.toFixed(2)} m, ${sim.pose.yaw_deg.toFixed(0)}°`;
      $("odom").textContent = `${sim.odom.x.toFixed(2)}, ${sim.odom.y.toFixed(2)} m, ${sim.odom.heading_deg.toFixed(0)}°`;
      $("motion").textContent = sim.motion ? `${sim.motion.kind} ${sim.motion.outcome}` : "–";
    }
    $("api").textContent = st.jevomir.url || "off (oracle only)";
    $("api").title = st.jevomir.error || "";
    const a = st.agent;
    $("agentStatus").textContent = a ? `${a.status} · ${a.label} · step ${a.steps.length}` : "";
    $("agentStatus").className = "status " + (a ? a.status : "");
    const running = a && a.status === "running";
    $("go").disabled = running;
    document.querySelectorAll("[data-drive]:not([data-drive=stop])").forEach((b) => b.disabled = running);
    const s = a && a.summary && a.summary.status ? a.summary : null;
    $("summary").textContent = s ? `${s.status}: ${s.steps} steps, ${s.questions} API calls, ${s.distance_m} m from the target, ${s.bumps} bumps, ${s.wall_s} s` : "";
    const runKey = a ? `${a.target}/${a.policy}/${a.status}` : null;
    if (a && (a.steps.length !== shownSteps || runKey !== shownRun)) {
      shownSteps = a.steps.length; shownRun = runKey; renderSteps(a);
    }
    if (!a && shownSteps !== -1) { shownSteps = -1; $("stepList").textContent = "No run yet."; $("stepList").classList.add("muted"); }
  } catch (e) { /* server restarting */ }
  setTimeout(poll, 300);
}
loadWorld(); poll();
</script>
</body>
</html>
