<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arm 3D view</title>
  <style>
    @font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url(/static/fonts/barlow-600.woff2) format("woff2"); }
    @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(/static/fonts/barlow-condensed-700.woff2) format("woff2"); }
    :root {
      --bg: #121a24;
      --panel: rgb(15 24 35 / 0.72);
      --lcd: #e9f7fb;
      --lcd-dim: #8fa3b8;
      --water: #3cc8e2;
      --red: #e0383e;
      --amber: #f3aa3c;
      font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--lcd);
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
    canvas { display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      max-width: calc(100vw - 32px);
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(6px);
    }
    .hud h1 { margin: 0; font-size: 0.95rem; font-weight: 600; color: var(--lcd-dim); }
    .hud .phase { font-family: "Barlow Condensed", "Barlow", sans-serif; font-size: 2rem; font-weight: 700; line-height: 1.1; }
    .hud .counts { font-size: 1rem; color: var(--lcd-dim); }
    .badge { display: inline-block; margin-left: 0.4rem; padding: 0 0.55em; border-radius: 999px; font-size: 0.8rem; background: #2a3849; color: var(--lcd); }
    .badge[data-state="ready"] { background: #1c5d6b; }
    .badge[data-state="error"] { background: var(--red); }
    .legend {
      position: fixed;
      right: 16px;
      bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.3rem 1rem;
      max-width: calc(100vw - 32px);
      font-size: 0.85rem;
      color: var(--lcd-dim);
    }
    .legend i { display: inline-block; width: 0.8rem; height: 0.8rem; margin-right: 0.35rem; border-radius: 3px; vertical-align: -0.1rem; }
    .embed .hud { top: 12px; left: auto; right: 12px; padding: 0.3rem 0.7rem; }
    .embed .hud .phase, .embed .hud .counts, .embed .hud h1 span { display: none; }
    .embed .legend .help { display: none; }
  </style>
  <script type="importmap">{"imports": {"three": "/twin-assets/three/three.module.min.js"}}</script>
</head>
<body>
  <div class="hud">
    <h1><span>reBot B601-RS · </span><span id="mode">3D</span><b class="badge" id="badge">loading</b></h1>
    <div class="phase" id="phase">–</div>
    <div class="counts" id="counts"></div>
  </div>
  <div class="legend">
    <span><i style="background: #3cc8e2"></i>pick workspace</span>
    <span><i style="background: rgb(60 200 226 / 0.35)"></i>what the wrist camera sees</span>
    <span class="help">drag: orbit · right-drag: pan · wheel: zoom · double-click: reset · Space: hold</span>
  </div>
  <script type="module" src="/static/twin.js"></script>
</body>
</html>
