<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laundry sorter</title>
  <link rel="preload" href="/static/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="panel" aria-label="Control panel">
    <div class="display">
      <div class="display-top">
        <span class="mode" id="mode" data-mode="idle">Idle</span>
        <span class="next" id="next"></span>
      </div>
      <h1 class="phase" id="phase" aria-live="polite">Ready</h1>
      <ol class="program" id="program" aria-label="Steps for one item">
        <li class="group"><span class="group-name">From the box</span>
          <ol>
            <li data-phase="look_box"><i></i>Look</li>
            <li data-phase="sense_box"><i></i>Choose</li>
            <li data-phase="pick_from_box"><i></i>Grab</li>
            <li data-phase="place_on_bg"><i></i>Lay out</li>
          </ol>
        </li>
        <li class="group"><span class="group-name">Sorting</span>
          <ol>
            <li data-phase="look_bg"><i></i>Look</li>
            <li data-phase="sense_bg"><i></i>Check color</li>
            <li data-phase="pick_from_bg"><i></i>Pick up</li>
            <li data-phase="drop_to_bin"><i></i>Into bin</li>
          </ol>
        </li>
      </ol>
    </div>

    <dl class="readouts">
      <div><dt>Cycle</dt><dd id="cycle">0</dd></div>
      <div><dt>Last cycle</dt><dd id="cycle-time">–</dd></div>
      <div><dt>Misses in a row</dt><dd id="failures">0</dd></div>
    </dl>

    <button class="hold" id="hold" type="button" title="Freeze the arm where it is (Space or Esc)">
      <span class="hold-face">
        <span class="hold-word">Hold</span>
        <span class="hold-key">Space</span>
      </span>
    </button>
  </header>

  <main class="stage">
    <figure class="screen">
      <img id="decision" src="/stream/decision.mjpg" alt="The last frame the robot decided on, with what it found drawn on top">
      <iframe id="twin" title="3D view of the arm, the table and the clothes" hidden></iframe>
      <figcaption class="screen-tabs" role="tablist" aria-label="Main screen">
        <button type="button" role="tab" data-view="decision" aria-selected="true">Last decision</button>
        <button type="button" role="tab" data-view="twin" aria-selected="false">3D view</button>
      </figcaption>
      <div class="alerts">
        <p class="alert alert-conn" id="conn" hidden>No connection to the sorter. Hold may not reach the arm. Retrying…</p>
        <p class="alert alert-error" id="error" hidden></p>
        <p class="alert alert-health" id="health" hidden></p>
      </div>
    </figure>

    <aside class="side">
      <figure class="porthole">
        <div class="porthole-glass">
          <img id="live" src="/stream/live.mjpg" alt="Live view from the camera on the robot's wrist">
        </div>
        <figcaption><span class="live-dot"></span>Wrist camera</figcaption>
      </figure>

      <section class="bins" aria-label="Items sorted into each bin">
        <div class="bin" data-bin="light">
          <div class="stack" id="stack-light"></div>
          <span class="count" id="count-light">0</span>
          <span class="bin-name">Light</span>
        </div>
        <div class="bin" data-bin="dark">
          <div class="stack" id="stack-dark"></div>
          <span class="count" id="count-dark">0</span>
          <span class="bin-name">Dark</span>
        </div>
        <div class="bin" data-bin="colored">
          <div class="stack" id="stack-colored"></div>
          <span class="count" id="count-colored">0</span>
          <span class="bin-name">Colored</span>
        </div>
      </section>
    </aside>
  </main>

  <footer class="bottom">
    <div class="controls" role="group" aria-label="Run controls">
      <button type="button" data-cmd="start" title="Start a new run">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>Start</button>
      <button type="button" data-cmd="pause" title="Pause after the current step">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>Pause</button>
      <button type="button" data-cmd="resume" title="Continue the run">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>Resume</button>
      <button type="button" data-cmd="step" title="Run one step, then pause">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5v11l7-5.5zM11 2.5h2.5v11H11z"/></svg>Step</button>
      <button type="button" data-cmd="stop" title="Finish the current step, go home, end the run">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z"/></svg>Stop</button>
      <button type="button" data-cmd="reset" title="After a hold or error: lift, open the gripper, go home, continue">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.9.7A3.5 3.5 0 1 0 8 4.5V7L4.5 3.5 8 0z"/></svg>Reset</button>
    </div>
    <ol class="events" id="events" aria-label="Recent warnings"></ol>
  </footer>

  <script>const PHASE_LABELS = __PHASE_LABELS__;</script>
  <script src="/static/app.js"></script>
</body>
</html>
