# Defaults for every section. Merge order: default.yaml → rig.yaml → hand_eye.yaml → local.yaml.
# Each block owns its section (docs/architecture.md → Config). Put machine overrides in
# config/local.yaml (gitignored), e.g. `backends: {camera: sim}`.

# real | sim per component. `run --sim` makes the hardware (camera, arm) sim; with the physics
# engine only the hardware is simulated and the rest runs its real code on the rendered frames.
backends:
  camera: real
  arm: real
  calibration: real
  box_detector: real
  color_classifier: real

# Simulator world (block 0). The arm runs the real controller and kinematics (block 5).
sim:
  engine: physics    # physics: MuJoCo (arm dynamics, cloth, rendered RGB-D); kinematic: quick, for tests
  realtime: 1.0      # physics: simulated seconds per wall second; 0 = as fast as the CPU allows
  use_sam3: false    # physics: segment the background with the real SAM3 service, not the render
  seed: 0
  items: [light, dark, colored, colored, light, dark]  # in the box at start
  miss_prob: 0.2     # a closed gripper holds nothing although it reached the cloth
  double_prob: 0.1   # a pick from the box grabs two items
  time_scale: 0.5    # kinematic: arm motion time × this: 1 = the real arm's speed, 0 = instant
  vision_s: 0.4      # sim vision "thinking" time per frame
  width: 640
  height: 480
  focal_px: 615                   # D435i color at 640x480
  camera_mount_mm: [-140, 0, 55]  # wrist camera in the TCP frame (x = approach), looks along x
  item_radius_mm: 30
  layout:            # the table, arm base at the origin, +x forward, +y left, mm
    box: {center_mm: [0, -270], size_mm: [240, 180], floor_z_mm: 5, wall_mm: 60}  # inside
    background: {center_mm: [270, 0], size_mm: [240, 180]}                          # the gray mat
    bins:
      centers_mm: {light: [257, 306], dark: [0, 400], colored: [-257, 306]}
      size_mm: 180
      wall_mm: 150
      floor_z_mm: 5

camera: {}           # block 1
calibration: {}      # block 2
box_detector:        # block 3
  avoid_radius_px: 30
  wall_margin_px: 60     # ~25 mm on the box floor from the look pose
  cloth_height_mm: 8
  min_cloth_px: 1500
color_classifier:    # block 4 (D-013)
  sam:                         # remote SAM3 segmentation service
    url: https://exes-shape-zoning.ngrok-free.dev
    api_key: ""                # secret: set it in config/local.yaml or the SAM3_API_KEY env var
    prompts: [clothing, sock]  # object categories, one request each; [blob] for the sim scene
    threshold: 0.5             # instance score
    mask_threshold: 0.5
    timeout_s: 10
  min_area_px: 1500            # smaller blobs are noise
  max_area_frac: 0.8           # a blob covering more of the ROI is the background itself
  overlap_max: 0.5             # drop an instance this much covered by a better-scored one
  erode_px: 5                  # erode the mask before color stats (shadows, edges)
  lightness_dark: 22           # median L* below → dark whatever the chroma (navy, dark brown)
  chroma_colored: 20           # median Lab chroma at or above → colored
  lightness_light: 55          # else median L* at or above → light, below → dark
  confidence_margin: 10        # distance from the deciding threshold that gives confidence 1
  grasp_inset_px: 15           # the re-grasp point is at least this far inside the blob
  grasp_depth_tol_mm: 5        # points this close to the highest count as the highest
  depth_window_px: 5           # window for the robust depth of the grasp point
arm:                 # block 5 (D-014)
  dry_run: false     # real backend: rebot_b601's simulated motors instead of the CAN bus
  speed_scale: 0.5   # of rebot_b601's joint speeds (capped at 0.6)
  safe_z_mm: 100     # recover() / shutdown() first lift the TCP to this height
  z_min_mm: 3        # table clearance for every point of the arm
  place_release_height_mm: 90   # TCP above the mat at place_bg (sim.layout tool)
  bin_release_height_mm: 90     # TCP above the bin rim at bin_<color> (sim.layout tool)
  gripper: {open: 1.0, empty_below: 0.01}   # cloth keeps the fingers ~0.02-0.05 open (physics sim)

state_machine:       # block 6
  empty_confirmations: 2       # EMPTY box results in a row before DONE
  max_consecutive_failures: 5  # then ERROR, paused
  low_confidence: 0.5          # color confidence below this logs a warning
  save_runs: true              # run logs: every decision observation + what was decided
  runs_dir: data/runs

dashboard:           # block 7
  host: 127.0.0.1    # 0.0.0.0 to open the dashboard from another device
  port: 8000
  stream_fps: 10     # live wrist feed and decision frame streams
  jpeg_quality: 80
  status_hz: 5       # max rate of status pushes over /ws
