# Defaults for every section. Merge order: default.yaml → rig.yaml → hand_eye.yaml → local.yaml.
# Each block owns its section (docs/architecture.md → Config). Put machine overrides in
# config/local.yaml (gitignored), e.g. `backends: {camera: real}`.

# real | sim per component. Swap one at a time during integration.
backends:
  camera: sim
  arm: sim
  calibration: sim
  box_detector: sim
  color_classifier: sim

# Simulator world (block 0).
sim:
  seed: 0
  items: [light, dark, colored, colored, light, dark]  # in the box at start
  miss_prob: 0.2     # a pick grabs nothing
  double_prob: 0.1   # a pick from the box grabs two items
  motion_s: 0.3      # duration of every arm motion, so the loop can be watched live
  width: 640
  height: 480
  cam_height_mm: 400
  item_radius_mm: 35
  zones:             # what the camera sees from each look pose, arm frame, mm
    box: {center_mm: [350, -200], width_mm: 300, surface_z_mm: 40}
    background: {center_mm: [350, 150], width_mm: 300, surface_z_mm: 0}

camera: {}           # block 1
calibration: {}      # block 2
box_detector:        # block 3
  avoid_radius_px: 30
color_classifier: {} # block 4
arm: {}              # block 5

state_machine:       # block 6
  empty_confirmations: 2
  max_consecutive_failures: 5

dashboard:           # block 7
  host: 127.0.0.1
  port: 8000
