# Defaults for every section. Merge order: default.yaml → rig.yaml → calibration.yaml → local.yaml.
# Each block owns its section (docs/architecture.md → Config). Put machine overrides in
# config/local.yaml (gitignored), e.g. `backends: {camera: real}`.

# real | sim per component. Swap one at a time during integration.
backends:
  camera: sim
  arm: sim
  calibration: sim
  box_detector: sim
  color_classifier: sim

# Simulator world (block 0).
sim:
  seed: 0
  items: [light, dark, colored, colored, light, dark]  # in the box at start
  miss_prob: 0.2     # a pick grabs nothing
  double_prob: 0.1   # a pick from the box grabs two items
  motion_s: 0.8      # per path segment of an arm motion (a pick has 3), so the loop can be watched
  vision_s: 0.4      # sim vision "thinking" time per frame
  width: 640
  height: 480
  cam_height_mm: 400
  item_radius_mm: 35
  zones:             # what the camera sees from each look pose, arm frame, mm
    box: {center_mm: [350, -200], width_mm: 300, surface_z_mm: 40}
    background: {center_mm: [350, 150], width_mm: 300, surface_z_mm: 0}

camera:              # block 1: SO-101 wrist camera, UVC, RGB only (D-014)
  name: HD Camera    # macOS: found by name, the OpenCV index changes on USB drops
  index: 0           # only without a name / off macOS; `python -m sorter.camera.probe`
  width: 1280
  height: 720
  fps: 30
  hfov_deg: 70       # approximate intrinsics only; pixel → arm uses the zone homography
  fresh_skip_frames: 2
calibration: {}      # block 2: zones are written to calibration.yaml by the setup tool
box_detector:        # block 3: SAM3 masks, same service as color_classifier.sam (D-015)
  avoid_radius_px: 30
  min_area_px: 800
  empty_coverage: 0.02         # cloth share of the box ROI below this → EMPTY
  wall_margin_px: 40           # grasp this far inside the ROI (walls, camera)
  min_inset_px: 12             # and this far inside the cloth
color_classifier:    # block 4 (D-013)
  sam:                         # remote SAM3 segmentation service
    url: https://exes-shape-zoning.ngrok-free.dev
    api_key: ""                # secret: set it in config/local.yaml or the SAM3_API_KEY env var
    prompts: [clothing, sock]  # object categories, one request each; [blob] for the sim scene
    threshold: 0.5             # instance score
    mask_threshold: 0.5
    timeout_s: 10
  min_area_px: 1500            # smaller blobs are noise
  max_area_frac: 0.8           # a blob covering more of the ROI is the background itself
  overlap_max: 0.5             # drop an instance this much covered by a better-scored one
  erode_px: 5                  # erode the mask before color stats (shadows, edges)
  lightness_dark: 22           # median L* below → dark whatever the chroma (navy, dark brown)
  chroma_colored: 20           # median Lab chroma at or above → colored
  lightness_light: 55          # else median L* at or above → light, below → dark
  confidence_margin: 10        # distance from the deciding threshold that gives confidence 1
  grasp_inset_px: 15           # the re-grasp point is at least this far inside the blob
  grasp_depth_tol_mm: 5        # points this close to the highest count as the highest
  depth_window_px: 5           # window for the robust depth of the grasp point
arm:                 # block 5: SO-101, Feetech STS3215 bus (D-014)
  port: auto                   # the only /dev/cu.usbmodem*; set it if there are several
  signs: [1, 1, 1, 1, 1]       # joint direction vs the URDF, per joint
  joint_speed_deg_s: 60
  linear_speed_mm_s: 80
  tcp_extend_mm: 0             # fingertips beyond the URDF gripper frame
  grasp_max_tilt_deg: 25
  roll_deg: 93.9               # wrist roll of the rig: camera image up = away from the base
  table_z_mm: -20              # the table is ≈ 17 mm below the URDF base origin
  gripper:
    open: 0.7
    torque_limit: 500          # of 1000: squeeze on cloth
    empty_below: 0.03          # opening after closing below this → likely empty

state_machine:       # block 6
  empty_confirmations: 2       # EMPTY box results in a row before DONE
  max_consecutive_failures: 5  # then ERROR, paused
  low_confidence: 0.5          # color confidence below this logs a warning
  save_runs: true              # run logs: every decision observation + what was decided
  runs_dir: data/runs

dashboard:           # block 7
  host: 127.0.0.1    # 0.0.0.0 to open the dashboard from another device
  port: 8000
  stream_fps: 10     # live wrist feed and decision frame streams
  jpeg_quality: 80
  status_hz: 5       # max rate of status pushes over /ws
