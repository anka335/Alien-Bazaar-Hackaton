# Defaults for every section. Merge order: default.yaml → rig.yaml → hand_eye.yaml → local.yaml.
# Each block owns its section (docs/architecture.md → Config). Put machine overrides in
# config/local.yaml (gitignored), e.g. `backends: {camera: sim}`.

# real | sim per component. `run --sim` makes the hardware (camera, arm) sim: MuJoCo simulates
# the hardware and the rest runs its real code on the rendered frames.
backends:
  camera: real
  arm: real
  calibration: real
  box_detector: real
  floor_detector: real

# Simulator world (D-032, D-034): a shared base scene + one scene file per stage (load: A,
# unload: B). The arm runs the real controller and kinematics.
sim:
  realtime: 1.0      # simulated seconds per wall second; 0 = as fast as the CPU allows
  use_sam3: false    # segment with the real SAM3 service, not the render's segmentation
  seed: 0
  scenes: [load, unload]  # what src/sorter/sim/scenes/<name>/scene.py adds to the base
  load:              # stage A's scene: socks on the floor around the rover (area: reach | view)
    socks: [light, dark, colored]
  unload:            # stage B's scene: the laundry bins, socks in the cargo box
    cargo: {light: 1, dark: 1, colored: 1}
  miss_prob: 0.0     # a closing gripper catches nothing (the sim's grip is optimistic)
  cloth_collisions: true  # cloth on cloth lies on top (a pile ~5x slower); false: piles pass through
  width: 640
  height: 480
  focal_px: 615                   # D435i color at 640x480
  camera_mount_mm: [-140, 0, 55]  # wrist camera in the TCP frame (x = approach), looks along x
  layout:            # the rover, arm base at the origin on the deck (z = 0), +x forward, +y left, mm
    # measured on the rover (D-042); the equipment behind the arm is still a photo estimate
    floor_z_mm: -192                                          # the floor fit (calibration.level, D-050); 200 by tape
    body: {center_mm: [-90, 0], size_mm: [420, 420]}         # chassis + wheels, from above
    wheel_width_mm: 130
    deck: {center_mm: [-90, 0], size_mm: [300, 185]}         # the plate; the arm at its front edge
    cargo:                                                    # one cardboard box, right of the arm (D-045)
      center_mm: [-220, -190]                                 # right, behind the front wheel: from a photo (D-050)
      size_mm: [182, 182]                                     # inside (190 outside)
      floor_z_mm: -41                                         # inside floor; its underside 45 below the deck
      wall_mm: 75                                             # the rim is 34 above the deck
      wall_t_mm: 4
    floor_view: {center_mm: [310, 0], size_mm: [280, 240]}   # the floor look_floor frames
    laundry:            # the unload station: boxes like the cargo box on the floor in front (D-043)
      centers_mm: {light: [290, 220], dark: [290, 0], colored: [290, -220]}   # not measured
      size_mm: 190                                            # outside
      height_mm: 75
      wall_t_mm: 4

camera: {}           # shared
calibration:         # shared
  board_z_mm: -184   # the printed board's top: 16 mm on the floor (z -200)
  marks_z_mm: -199   # the floor, where the tape marks lie
box_detector:        # stage B (the cargo compartments)
  avoid_radius_px: 30
  wall_margin_mm: 45     # an open finger (arm.gripper.open) and its pad fit between grasp and wall
  cloth_height_mm: 8
  min_cloth_px: 1500
color_classifier:    # stage A: the floor detector's segmentation + color (D-013)
  sam:                         # remote SAM3 segmentation service
    url: https://exes-shape-zoning.ngrok-free.dev
    api_key: ""                # secret: set it in config/local.yaml or the SAM3_API_KEY env var
    prompts: [clothing, sock]  # object categories, one request each; [blob] for the sim scene
    threshold: 0.5             # instance score
    mask_threshold: 0.5
    timeout_s: 10
  min_area_px: 1500            # smaller blobs are noise
  max_area_frac: 0.8           # a blob covering more of the ROI is the background itself
  overlap_max: 0.5             # drop an instance this much covered by a better-scored one
  erode_px: 5                  # erode the mask before color stats (shadows, edges)
  lightness_dark: 22           # median L* below → dark whatever the chroma
  lightness_dim: 35            # median L* below and chroma below chroma_muted → dark too:
  chroma_muted: 35             #   a dim, muted color (navy, dark brown) under a lamp
  chroma_colored: 20           # median Lab chroma at or above → colored
  lightness_light: 55          # else median L* at or above → light, below → dark
  confidence_margin: 10        # distance from the deciding threshold that gives confidence 1
  grasp_inset_px: 15           # the re-grasp point is at least this far inside the blob
  grasp_depth_tol_mm: 5        # points this close to the highest count as the highest
  depth_window_px: 5           # window for the robust depth of the grasp point
arm:                 # shared (D-019); z_min_mm and keep_out_mm come from rig.yaml
  dry_run: false     # real backend: rebot_b601's simulated motors instead of the CAN bus
  base_yaw_deg: -90  # joint 1 = 0 points to the rover's right (the arm stands turned on the deck)
  base_tilt_deg: [1.2, 6.15]  # the base leans ~6° forward: from the floor the scans saw (D-050)
  speed_scale: 1.0      # of rebot_b601's joint speeds at start; the dashboard changes it
  max_speed_scale: 1.4  # the dashboard's maximum; at most ~1.43, the motors' velocity limit
  safe_z_mm: 100     # recover() / shutdown() first lift the TCP to this height
  drop_height_mm: 30 # TCP above the rim at cargo_<color> / laundry_<color> (sim.layout tool)
  drop_settle_s: 0.8 # hold still over the drop before opening: the hanging sock stops swinging
  keep_out_margin_mm: 15  # around the keep-out boxes (rig.yaml: the rover body, cargo walls)
  gripper: {open: 0.6, empty_below: 0.02}   # 0.6: ~27 mm a finger; closed on nothing reads ≤ 0.012 on the rig

state_machine:       # shared: the run loop of both modes
  empty_confirmations: 2       # "nothing there" results in a row before DONE
  max_consecutive_failures: 5  # then ERROR, paused
  low_confidence: 0.5          # color confidence below this logs a warning
  save_runs: true              # run logs: every decision observation + what was decided
  runs_dir: data/runs

dashboard:           # shared
  host: 127.0.0.1    # 0.0.0.0 to open the dashboard from another device
  port: 8000
  stream_fps: 10     # live wrist feed and decision frame streams
  jpeg_quality: 80
  status_hz: 5       # max rate of status pushes over /ws
