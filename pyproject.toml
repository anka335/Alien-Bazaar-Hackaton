[project]
name = "sorter"
version = "0.1.0"
description = "Robotic arm that sorts clothes by color"
readme = "README.md"
# The arm SDK (reBotArm_control_py) requires Python < 3.12 (D-010).
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "mujoco>=3.14.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rebot-b601",
    "uvicorn>=0.29",
    "websockets>=12",
]

[tool.uv.sources]
# the arm kinematics, planner and driver (D-014); `uv sync --extra hardware` adds the motor bus
rebot-b601 = { path = "rebot_b601", editable = true }

[project.optional-dependencies]
hardware = ["rebot-b601[hardware]"]
# the RealSense SDK has wheels for Linux and Windows only
camera = ["pyrealsense2>=2.55; sys_platform == 'linux' or sys_platform == 'win32'"]

[project.scripts]
sorter = "sorter.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
